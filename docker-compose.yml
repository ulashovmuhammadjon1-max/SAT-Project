services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sat_platform
    ports:
      - "5432:5432"
    volumes:
      - sat_platform_postgres_data:/var/lib/postgresql/data

volumes:
  sat_platform_postgres_data:
