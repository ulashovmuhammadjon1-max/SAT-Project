      const A = new THREE.Vector3(), B = new THREE.Vector3(), Y = new THREE.Vector3(0, 1, 0);
      setAnim("Idle", 0); guy.updateMatrixWorld(true);
      for (const g of gear) { bones[g.a].getWorldPosition(A); bones[g.b].getWorldPosition(B); g.m.geometry = new THREE.CapsuleGeometry(g.r, Math.max(0.01, A.distanceTo(B) - g.r), 4, 12); }
      function updateGear() {
        guy.updateMatrixWorld(true);
        for (const g of gear) { bones[g.a].getWorldPosition(A); bones[g.b].getWorldPosition(B); g.m.position.copy(A).add(B).multiplyScalar(0.5); g.m.quaternion.setFromUnitVectors(Y, B.clone().sub(A).normalize()); }
        for (const k of ankles) { bones[k.b].getWorldPosition(A); k.m.position.copy(A); k.m.position.y -= 0.02; }
      }
      const MAX = { x: 0.22, z: -0.88 };

      // ---------------- shots ----------------
      const SCR = V(LAP.x, DESK.top + 0.27, LAP.z);            // screen centre
      const PH = V(PHONE.x, DESK.top + 0.04, PHONE.z);          // phone
      const FACE = V(MAX.x, 1.6, MAX.z);                        // Max's face
      // [start, end, camFrom, camTo, lookFrom, lookTo, fov]
      const SHOTS = [
        [0, TT.s2, V(0.62, 1.68, -0.42), V(0.5, 1.56, -0.78), SCR, SCR, 38],                     // over the shoulder: 1210
        [TT.s2, TT.q, V(0.24, 1.36, -0.82), V(0.22, 1.34, -0.95), SCR, SCR, 38],                    // the review list
        [TT.q, TT.phone, V(-1.6, 1.85, 2.4), V(-1.2, 1.75, 1.9), V(0.4, 1.2, -1.4), V(0.45, 1.2, -1.4), 44], // wide, behind the card
        [TT.phone, TT.split, V(PHONE.x + 0.12, DESK.top + 0.5, PHONE.z + 0.34), V(PHONE.x + 0.08, DESK.top + 0.4, PHONE.z + 0.26), PH, PH, 36], // the phone
        [TT.split, TT.follow, V(1.75, 1.55, 0.55), V(1.6, 1.5, 0.4), V(0.35, 1.68, -1.25), V(0.35, 1.68, -1.25), 46], // B: studying (frames the lower half)
        [TT.follow, TT.loop, V(MAX.x + 0.1, 1.78, -1.95), V(MAX.x + 0.08, 1.74, -1.85), V(MAX.x, 1.42, MAX.z), V(MAX.x, 1.45, MAX.z), 50],   // Max, from the laptop
        [TT.loop, TT.end, V(0.62, 1.68, -0.42), V(0.6, 1.66, -0.47), SCR, SCR, 38],                 // back to frame 1
      ];
      const shotAt = (t) => { for (let i = SHOTS.length - 1; i >= 0; i--) if (t >= SHOTS[i][0]) return i; return 0; };

      host.render = (t) => {
        const si = shotAt(t), S = SHOTS[si];
        const u = easeInOut((t - S[0]) / (S[1] - S[0]));
        camera.position.lerpVectors(S[2], S[3], u);
        const look = new THREE.Vector3().lerpVectors(S[4], S[5], u);
        const punch = 1 - easeOut(win(t, S[0], S[0] + 0.35));
        camera.position.lerp(look, 0.05 * punch * (si === 0 && t < 0.05 ? 0 : 1));
        camera.fov = S[6]; camera.updateProjectionMatrix(); camera.lookAt(look);
        fill.position.copy(camera.position).add(V(0.2, 0.2, 0));

        // laptop screen
        let mode = "score", su = win(t, 0.0, 1.1);
        if (t >= TT.s2 && t < TT.q) { mode = "review"; su = win(t, TT.s2, TT.s2 + 0.8); }
        else if (t >= TT.split && t < TT.loop) { mode = "exam"; su = 1; }
        else if (t >= TT.loop) { mode = "score"; su = 1; }
        else if (t >= TT.q) { mode = "score"; su = 1; }
        const sig = mode + Math.round(su * 30);
        if (sig !== lastScreen) { drawScreen(mode, su); lastScreen = sig; }

        // phone: lights up and buzzes
        const on = t >= TT.buzz && t < TT.split + 1.0;
        pscreen.material = on ? pscreenOn : pscreenOff;
        phoneGlow.intensity = on ? 0.5 : 0;
        const bz = (t >= TT.buzz && t < TT.buzz + 0.4) || (t >= TT.buzz + 0.6 && t < TT.buzz + 1.0) || (t >= TT.buzz + 1.6 && t < TT.buzz + 2.0);
        phone.position.x = PHONE.x + (bz ? Math.sin(t * 190) * 0.004 : 0);
        phone.rotation.y = -0.35 + (bz ? Math.sin(t * 230) * 0.05 : 0);

        // Max: idle at the desk, facing the laptop
        guy.position.set(MAX.x, 0, MAX.z); guy.rotation.set(0, Math.PI, 0);
        setAnim("Idle", t + 2.0);
        updateGear();

        renderer.render(scene, camera);
      };
      host.render(host.clock.t);
      host.ready();
    </script>
  </body>
</html>
