<!doctype html>
<!--
  payoff3d: the "800" in beveled 3D, built from the registry's extruded-logo block.
  mode "hook":   800 stands in gold, then each digit tips over backward and goes dark red.
  mode "payoff": the digits flip up one by one in gold and the word swings to face camera.
  Seek-safe: every frame is render(t) from one linear GSAP clock.
-->
<html
  lang="en"
  data-composition-variables='[
    { "id": "mode", "type": "enum", "label": "Mode", "default": "payoff", "options": [ { "value": "hook", "label": "Hook (falls)" }, { "value": "payoff", "label": "Payoff (rises)" } ] },
    { "id": "line1", "type": "string", "label": "Top line", "default": "Walk in ready.", "maxLength": 40 },
    { "id": "line2", "type": "string", "label": "Second line", "default": "Aim for 800.", "maxLength": 60 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Newsreader";
        src: url("assets/fonts/newsreader.woff2") format("woff2");
        font-weight: 200 800;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #070b16;
      }
      #p3-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background:
          radial-gradient(700px 700px at 50% 52%, rgba(59, 99, 236, 0.28), transparent 70%),
          radial-gradient(500px 420px at 70% 20%, rgba(17, 169, 198, 0.16), transparent 70%),
          #070b16;
      }
      #p3-canvas {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        display: block;
      }
      .p3-line {
        position: absolute;
        left: 70px;
        right: 70px;
        text-align: center;
        font-family: "Newsreader", serif;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #ffffff;
        opacity: 0;
      }
      #p3-line1 {
        top: 250px;
        font-size: 112px;
        line-height: 1.02;
      }
      #p3-line2 {
        top: 1235px;
        font-size: 70px;
        line-height: 1.08;
        color: #ff5a6a;
      }
      #p3-root.payoff #p3-line2 {
        color: #f3c86b;
      }
    </style>
  </head>
  <body>
    <div
      id="p3-root"
      data-composition-id="payoff3d"
      data-start="0"
      data-duration="4.5"
      data-width="1080"
      data-height="1920"
    >
      <canvas id="p3-canvas" class="clip" data-start="0" data-duration="4.5" data-track-index="1"></canvas>
      <div id="p3-line1" class="p3-line"></div>
      <div id="p3-line2" class="p3-line"></div>
    </div>

    <script>
      (function () {
        var html = document.documentElement;
        var defaults = {};
        try {
          JSON.parse(html.getAttribute("data-composition-variables") || "[]").forEach(function (v) {
            defaults[v.id] = v.default;
          });
        } catch (e) {}
        var scoped =
          (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        var vars = Object.assign({}, defaults, window.__hfVariables || {}, scoped);
        var root = document.getElementById("p3-root");
        var duration = Math.max(0.001, parseFloat(root.dataset.duration) || 4.5);
        var payoff = vars.mode === "payoff";
        if (payoff) root.classList.add("payoff");
        var l1 = document.getElementById("p3-line1");
        var l2 = document.getElementById("p3-line2");
        l1.textContent = vars.line1 || "";
        l2.textContent = vars.line2 || "";

        var clock = { t: 0 };
        var scene = { vars: vars, duration: duration, clock: clock, render: null, payoff: payoff };
        window.__payoff3d = scene;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["payoff3d"] = new Promise(function (resolve) {
          scene.ready = resolve;
        });

        var tl = gsap.timeline({ paused: true });
        tl.to(clock, {
          t: duration,
          duration: duration,
          ease: "none",
          onUpdate: function () {
            if (scene.render) scene.render(clock.t);
          },
        });
        if (payoff) {
          tl.fromTo(l1, { opacity: 0, y: 30, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.9);
          tl.fromTo(l2, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.7);
        } else {
          // Frame 0 is the thumbnail: the hook line is already on screen.
          tl.fromTo(l1, { opacity: 1, scale: 1.04 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0);
          tl.fromTo(l2, { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 2.25);
        }
        window.__timelines = window.__timelines || {};
        window.__timelines["payoff3d"] = tl;
      })();
    </script>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/+esm";
      import { FontLoader } from "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/loaders/FontLoader.js/+esm";
      import { TextGeometry } from "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/geometries/TextGeometry.js/+esm";

      const host = window.__payoff3d;
      const W = 1080, H = 1920;
      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("p3-canvas"),
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;

      const scene = new THREE.Scene();
      // Softbox studio on black: warm key strips, cool rim, a bar panel the faces mirror.
      const studio = new THREE.Scene();
      studio.background = new THREE.Color(0x040406);
      const softbox = (w, h, x, y, z, color, power) => {
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(power), side: THREE.DoubleSide }),
        );
        m.position.set(x, y, z);
        m.lookAt(0, 0, 0);
        studio.add(m);
      };
      softbox(10, 2.2, 0, 7, 1, 0xfff1dc, 2.6);
      softbox(1.2, 7, -7, 1, 2, 0xffffff, 1.8);
      softbox(1.2, 7, 7, 1, -1, 0x9fc4ff, 1.6);
      const bars = document.createElement("canvas");
      bars.width = 1024;
      bars.height = 256;
      const bg = bars.getContext("2d");
      const fade = bg.createLinearGradient(0, 0, 0, 256);
      fade.addColorStop(0, "#8a8c93");
      fade.addColorStop(1, "#121318");
      bg.fillStyle = fade;
      bg.fillRect(0, 0, 1024, 256);
      bg.fillStyle = "#ffffff";
      for (const [x, w] of [[150, 60], [430, 140], [760, 36]]) bg.fillRect(x, 0, w, 256);
      const mirror = new THREE.Mesh(
        new THREE.PlaneGeometry(22, 8),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(bars), color: new THREE.Color(2, 2, 2), side: THREE.DoubleSide }),
      );
      mirror.position.set(0, 1, 9);
      mirror.lookAt(0, 1, 0);
      studio.add(mirror);
      softbox(9, 1.4, 0, 0.5, -7, 0x7fa8ff, 2);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(studio, 0.01).texture;
      scene.environmentIntensity = 0.85;

      const camera = new THREE.PerspectiveCamera(36, W / H, 0.1, 100);

      const rim = new THREE.DirectionalLight(0x8fb6ff, 4);
      rim.position.set(0, 3, -6);
      scene.add(rim);
      const key = new THREE.DirectionalLight(0xfff0dd, 1.5);
      key.position.set(-5, 4, 6);
      scene.add(key);

      const GOLD = new THREE.Color(0xe9c06a);
      const RED = new THREE.Color(0x8a1422);
      const material = new THREE.MeshStandardMaterial({ color: GOLD.clone(), metalness: 1, roughness: 0.22, emissive: new THREE.Color(0x000000) });

      const assetUrl = (p) =>
        typeof __hyperframes !== "undefined" && __hyperframes.assetUrl ? __hyperframes.assetUrl(p) : p;
      const font = await new FontLoader().loadAsync(assetUrl("assets/fonts/Geist-Bold.typeface.json"));

      const SIZE = 1.5;
      const scale = SIZE / font.data.resolution;
      const tracking = 0.1;
      const word = new THREE.Group();
      scene.add(word);
      const letters = [];
      let cursor = 0;
      for (const ch of "800") {
        const advance = ((font.data.glyphs[ch] || font.data.glyphs["?"]).ha || 600) * scale;
        const geometry = new TextGeometry(ch, {
          font, size: SIZE, depth: 0.5, curveSegments: 12,
          bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.04, bevelSegments: 6,
        });
        geometry.computeBoundingBox();
        const b = geometry.boundingBox;
        geometry.translate(-(b.min.x + b.max.x) / 2, 0, -0.25);
        const pivot = new THREE.Group();
        pivot.position.x = cursor + advance / 2;
        pivot.add(new THREE.Mesh(geometry, material));
        word.add(pivot);
        letters.push(pivot);
        cursor += advance + tracking;
      }
      const width = cursor - tracking;
      for (const p of letters) p.position.x -= width / 2;
      word.scale.setScalar(Math.min(1, 2.7 / width));

      // Contact shadow under the word.
      const sc = document.createElement("canvas");
      sc.width = 512;
      sc.height = 128;
      const sg = sc.getContext("2d");
      const grad = sg.createRadialGradient(256, 64, 0, 256, 64, 256);
      grad.addColorStop(0, "rgba(0,0,0,0.65)");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      sg.setTransform(1, 0, 0, 0.25, 0, 48);
      sg.fillStyle = grad;
      sg.fillRect(0, 0, 512, 512);
      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(4.6, 1.4),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }),
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = -0.02;
      scene.add(shadow);

      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const easeOutBack = (x) => { const u = clamp01(x) - 1; return 1 + 2.2 * u * u * u + 1.2 * u * u; };
      const easeInOut = (x) => { const u = clamp01(x); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
      const easeIn = (x) => { const u = clamp01(x); return u * u * u; };

      host.render = (t) => {
        const D = host.duration;
        if (host.payoff) {
          letters.forEach((p, i) => {
            const u = easeOutBack((t - 0.1 - i * 0.16) / 0.85);
            p.rotation.x = (1 - u) * (-Math.PI / 2);
            p.position.y = (1 - clamp01(u)) * -0.2;
            p.visible = t >= 0.1 + i * 0.16;
          });
          const swing = easeInOut((t - 0.7) / (D - 1.4));
          word.rotation.y = -0.45 + swing * 0.45;
          material.color.copy(GOLD);
          material.emissive.setRGB(0.05 * clamp01(t - 1), 0.035 * clamp01(t - 1), 0);
          // Slow dive toward the number.
          const z = 11.6 - 0.9 * easeInOut(t / D);
          camera.position.set(0, 1.0, z);
        } else {
          // Stand, swing so light runs across the bevels, then each digit topples backward.
          const swing = easeInOut(t / 1.9);
          word.rotation.y = -0.35 + swing * 0.35;
          letters.forEach((p, i) => {
            const u = easeIn((t - 1.55 - i * 0.14) / 0.55);
            p.rotation.x = -u * (Math.PI / 2);
            p.position.y = 0;
            p.visible = true;
          });
          const r = clamp01((t - 1.5) / 0.8);
          material.color.copy(GOLD).lerp(RED, r);
          material.roughness = 0.22 + 0.25 * r;
          const z = 10.2 + 0.8 * easeInOut((t - 1.4) / 1.6);
          camera.position.set(0, 1.0 + 0.6 * easeInOut((t - 1.4) / 1.6), z);
        }
        camera.lookAt(0, 0.3, 0);
        renderer.render(scene, camera);
      };
      host.render(host.clock.t);
      host.ready();
    </script>
  </body>
</html>
