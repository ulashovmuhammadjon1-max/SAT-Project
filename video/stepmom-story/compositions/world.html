<!doctype html>
<!--
  world: the whole film's 3D set, characters and camera, drawn as render(t) from one linear clock.
  Original blocky characters (rounded-cube heads, drawn eyes, sphere hands) on a modelled suburban lot.
  Shot list lives in SHOTS below; SCENARIO.md has the story.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05080f;
      }
      #w-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05080f;
      }
      #w-canvas {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="w-root" data-composition-id="world" data-start="0" data-duration="50" data-width="1080" data-height="1920">
      <canvas id="w-canvas" class="clip" data-start="0" data-duration="50" data-track-index="1"></canvas>
    </div>
    <script>
      (function () {
        var root = document.getElementById("w-root");
        var duration = parseFloat(root.dataset.duration) || 50;
        var clock = { t: 0 };
        var host = { clock: clock, duration: duration, render: null };
        window.__world = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["world"] = new Promise(function (r) {
          host.ready = r;
        });
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, {
          t: duration,
          duration: duration,
          ease: "none",
          onUpdate: function () {
            if (host.render) host.render(clock.t);
          },
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["world"] = tl;
      })();
    </script>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/+esm";
      import { RoundedBoxGeometry } from "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/geometries/RoundedBoxGeometry.js/+esm";

      const host = window.__world;
      const W = 1080, H = 1920;

      // ---------- helpers ----------
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const lerp = (a, b, u) => a + (b - a) * u;
      const smooth = (x) => { const u = clamp01(x); return u * u * (3 - 2 * u); };
      const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);
      const easeInOut = (x) => { const u = clamp01(x); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
      const win = (t, a, b) => clamp01((t - a) / (b - a));

      function canvasTex(w, h, draw, repeat) {
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        draw(c.getContext("2d"), w, h);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 8;
        if (repeat) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(repeat[0], repeat[1]); }
        return tex;
      }
      const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.8, metalness: 0 }, o));

      // ---------- renderer ----------
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("w-canvas"), antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x0b1322, 0.022);
      const camera = new THREE.PerspectiveCamera(48, W / H, 0.05, 500);

      // ---------- textures ----------
      const rng = mulberry32(7);
      const grassTex = canvasTex(512, 512, (g, w, h) => {
        g.fillStyle = "#3f5a2c"; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 9000; i++) {
          const x = rng() * w, y = rng() * h, l = 3 + rng() * 7;
          const c = 60 + rng() * 50;
          g.strokeStyle = `rgb(${c * 0.55},${c + 20},${c * 0.4})`;
          g.lineWidth = 1 + rng();
          g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rng() - 0.5) * 3, y - l); g.stroke();
        }
      }, [28, 28]);
      const asphaltTex = canvasTex(256, 256, (g, w, h) => {
        g.fillStyle = "#2b2d31"; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 4000; i++) { const v = 30 + rng() * 40; g.fillStyle = `rgb(${v},${v},${v + 4})`; g.fillRect(rng() * w, rng() * h, 2, 2); }
      }, [30, 2]);
      const sidingTex = canvasTex(256, 256, (g, w, h) => {
        g.fillStyle = "#c9d3dc"; g.fillRect(0, 0, w, h);
        for (let y = 0; y < h; y += 32) {
          const grd = g.createLinearGradient(0, y, 0, y + 32);
          grd.addColorStop(0, "#dfe6ec"); grd.addColorStop(0.85, "#c3ccd5"); grd.addColorStop(1, "#8e98a3");
          g.fillStyle = grd; g.fillRect(0, y, w, 32);
        }
      }, [5, 4]);
      const shingleTex = canvasTex(256, 256, (g, w, h) => {
        g.fillStyle = "#3a3433"; g.fillRect(0, 0, w, h);
        for (let row = 0; row < 16; row++) {
          for (let col = 0; col < 9; col++) {
            const v = 45 + rng() * 25;
            g.fillStyle = `rgb(${v + 8},${v},${v - 2})`;
            g.fillRect(col * 30 + (row % 2) * 15, row * 16, 28, 14);
          }
        }
      }, [4, 3]);
      const woodTex = canvasTex(256, 64, (g, w, h) => {
        g.fillStyle = "#8a5e3b"; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 26; i++) {
          g.strokeStyle = `rgba(${60 + rng() * 30},${35 + rng() * 20},20,0.55)`; g.lineWidth = 1 + rng() * 2;
          const y = rng() * h; g.beginPath(); g.moveTo(0, y);
          for (let x = 0; x <= w; x += 32) g.lineTo(x, y + (rng() - 0.5) * 4);
          g.stroke();
        }
      });
      const oldWoodTex = canvasTex(256, 64, (g, w, h) => {
        g.fillStyle = "#7a6a58"; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 30; i++) { g.strokeStyle = `rgba(40,35,30,${0.3 + rng() * 0.3})`; g.lineWidth = 1 + rng() * 2; const y = rng() * h; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + (rng() - 0.5) * 6); g.stroke(); }
      });
      const floorTex = canvasTex(256, 256, (g, w, h) => {
        for (let i = 0; i < 8; i++) { const v = 120 + rng() * 30; g.fillStyle = `rgb(${v},${v * 0.68},${v * 0.42})`; g.fillRect(0, i * 32, w, 31); g.fillStyle = "#4a3020"; g.fillRect(0, i * 32 + 31, w, 1); g.fillRect(((i * 97) % 200) + 20, i * 32, 2, 32); }
      }, [3, 3]);
      const wallpaperTex = canvasTex(128, 128, (g, w, h) => {
        g.fillStyle = "#e9d8bf"; g.fillRect(0, 0, w, h);
        g.fillStyle = "#dcc6a6"; for (let x = 0; x < w; x += 32) g.fillRect(x, 0, 10, h);
      }, [6, 3]);
      const stoneTex = canvasTex(128, 128, (g, w, h) => {
        g.fillStyle = "#77787a"; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 600; i++) { const v = 90 + rng() * 50; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(rng() * w, rng() * h, 3, 3); }
      });

      // ---------- sky ----------
      const skyGeo = new THREE.SphereGeometry(300, 32, 16);
      const nightSky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ side: THREE.BackSide, fog: false, map: canvasTex(4, 256, (g, w, h) => {
        const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, "#02040a"); grd.addColorStop(0.42, "#0a1426"); grd.addColorStop(0.5, "#1a2a46"); grd.addColorStop(1, "#05070c");
        g.fillStyle = grd; g.fillRect(0, 0, w, h); }) }));
      const dawnSky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ side: THREE.BackSide, fog: false, transparent: true, opacity: 0, depthWrite: false, map: canvasTex(4, 256, (g, w, h) => {
        const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, "#5f95d4"); grd.addColorStop(0.38, "#a9c6e6"); grd.addColorStop(0.5, "#ffc98f"); grd.addColorStop(1, "#6a6050");
        g.fillStyle = grd; g.fillRect(0, 0, w, h); }) }));
      dawnSky.scale.setScalar(0.99);
      scene.add(nightSky, dawnSky);
      const moon = new THREE.Mesh(new THREE.SphereGeometry(6, 24, 16), new THREE.MeshBasicMaterial({ color: 0xdfe6f5, fog: false, transparent: true }));
      moon.position.set(-70, 95, -180);
      scene.add(moon);
      const starPos = [];
      for (let i = 0; i < 700; i++) { const th = rng() * Math.PI * 2, ph = rng() * 1.2; starPos.push(280 * Math.cos(th) * Math.sin(ph), 280 * Math.cos(ph), 280 * Math.sin(th) * Math.sin(ph)); }
      const starGeo = new THREE.BufferGeometry(); starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
      const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xcfd8ff, size: 2, sizeAttenuation: false, fog: false, transparent: true }));
      scene.add(stars);

      // ---------- lights ----------
      const hemi = new THREE.HemisphereLight(0x2a3a5c, 0x0c1208, 0.6);
      scene.add(hemi);
      const key = new THREE.DirectionalLight(0x9fb4ff, 1.0);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      Object.assign(key.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 90 });
      key.shadow.bias = -0.0004;
      key.shadow.normalBias = 0.03;
      key.target.position.set(3, 0, 5);
      scene.add(key, key.target);
      const fill = new THREE.PointLight(0xdfe8ff, 9, 14, 1.6); scene.add(fill);
      const workLight = new THREE.PointLight(0xffb25a, 0, 12, 2); workLight.position.set(6.6, 2.6, 7.4); scene.add(workLight);

      // ---------- yard ----------
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), std(0xffffff, { map: grassTex, roughness: 0.92 }));
      ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
      const street = new THREE.Mesh(new THREE.PlaneGeometry(220, 7), std(0xffffff, { map: asphaltTex, roughness: 0.32, metalness: 0.1 }));
      street.rotation.x = -Math.PI / 2; street.position.set(0, 0.01, 16.5); street.receiveShadow = true; scene.add(street);
      const sidewalk = new THREE.Mesh(new THREE.BoxGeometry(220, 0.12, 1.8), std(0x8d8f93, { roughness: 0.5 }));
      sidewalk.position.set(0, 0.06, 12.9); sidewalk.receiveShadow = true; scene.add(sidewalk);
      for (let i = -12; i <= 12; i++) {
        const dash = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.02, 0.15), std(0xd8c76a, { roughness: 0.5 }));
        dash.position.set(i * 4.5, 0.02, 16.5); scene.add(dash);
      }
      // stepping stones from steps to the sidewalk
      for (let i = 0; i < 8; i++) {
        const s = new THREE.Mesh(new THREE.CylinderGeometry(0.42 + rng() * 0.08, 0.46, 0.08, 9), std(0xffffff, { map: stoneTex, roughness: 0.4 }));
        s.position.set((rng() - 0.5) * 0.25, 0.04, 3.9 + i * 1.05); s.rotation.y = rng() * 3; s.receiveShadow = true; scene.add(s);
      }
      // ---------- house ----------
      const house = new THREE.Group(); scene.add(house);
      const body = new THREE.Mesh(new THREE.BoxGeometry(11, 6, 8), std(0xffffff, { map: sidingTex, roughness: 0.75 }));
      body.position.set(0, 3, -4); body.castShadow = body.receiveShadow = true; house.add(body);
      const roofShape = new THREE.Shape(); roofShape.moveTo(-6.2, 0); roofShape.lineTo(0, 3.4); roofShape.lineTo(6.2, 0); roofShape.lineTo(-6.2, 0);
      const roof = new THREE.Mesh(new THREE.ExtrudeGeometry(roofShape, { depth: 9, bevelEnabled: false }), std(0xffffff, { map: shingleTex, roughness: 0.85 }));
      roof.position.set(0, 6, -8.5); roof.castShadow = true; house.add(roof);
      const trimMat = std(0xf3f1ec, { roughness: 0.6 });
      const chimney = new THREE.Mesh(new THREE.BoxGeometry(1, 3, 1), std(0x7a4636, { roughness: 0.9 }));
      chimney.position.set(3.6, 7.6, -5.5); chimney.castShadow = true; house.add(chimney);
      // windows with warm light
      const winGlow = std(0x000000, { emissive: 0xffb25a, emissiveIntensity: 1.4, roughness: 0.3 });
      for (const x of [-3.3, 3.3]) {
        const frame = new THREE.Mesh(new THREE.BoxGeometry(2.0, 2.1, 0.16), trimMat); frame.position.set(x, 3.3, 0.04); house.add(frame);
        const glass = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 1.8), winGlow); glass.position.set(x, 3.3, 0.13); house.add(glass);
        const mv = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.8, 0.05), trimMat); mv.position.set(x, 3.3, 0.16); house.add(mv);
        const mh = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.08, 0.05), trimMat); mh.position.set(x, 3.3, 0.16); house.add(mh);
        const sill = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.12, 0.35), trimMat); sill.position.set(x, 2.2, 0.2); house.add(sill);
        for (const s of [-1, 1]) { const sh = new THREE.Mesh(new THREE.BoxGeometry(0.55, 2.1, 0.08), std(0x2e4a5e)); sh.position.set(x + s * 1.32, 3.3, 0.1); house.add(sh); }
        const wl = new THREE.PointLight(0xffa954, 18, 11, 2); wl.position.set(x, 3.2, 1.3); house.add(wl);
      }
      const upWin = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.1), winGlow); upWin.position.set(0, 7.3, 0.55); house.add(upWin);
      // door, hallway glow behind it, hinge on the left
      const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(1.75, 2.75, 0.14), trimMat); doorFrame.position.set(0, 0.45 + 1.33, 0.03); house.add(doorFrame);
      const hall = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 2.45), std(0x000000, { emissive: 0xffbb6a, emissiveIntensity: 1.1 })); hall.position.set(0, 0.45 + 1.22, 0.11); house.add(hall);
      const doorPivot = new THREE.Group(); doorPivot.position.set(-0.7, 0.45, 0.13); house.add(doorPivot);
      const door = new THREE.Mesh(new RoundedBoxGeometry(1.4, 2.45, 0.1, 2, 0.02), std(0x7b2430, { roughness: 0.55 }));
      door.position.set(0.7, 1.225, 0); door.castShadow = true; doorPivot.add(door);
      for (const [y, h] of [[1.75, 0.9], [0.65, 0.8]]) { const pnl = new THREE.Mesh(new THREE.BoxGeometry(0.95, h, 0.04), std(0x6a1e28, { roughness: 0.5 })); pnl.position.set(0.7, y, 0.06); doorPivot.add(pnl); }
      const knob = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), std(0xd8b25a, { metalness: 0.9, roughness: 0.3 })); knob.position.set(1.22, 1.15, 0.1); doorPivot.add(knob);
      const lockPlate = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.22, 0.03), std(0xd8b25a, { metalness: 0.9, roughness: 0.3 })); lockPlate.position.set(1.22, 1.4, 0.08); doorPivot.add(lockPlate);
      // porch, steps, posts, roof, light
      const deck = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.45, 2.7), std(0xffffff, { map: woodTex, roughness: 0.55 })); deck.position.set(0, 0.225, 1.35); deck.receiveShadow = deck.castShadow = true; house.add(deck);
      for (const [y, z, d] of [[0.15, 3.0, 0.6], [0.3, 2.85, 0.3]]) { const st = new THREE.Mesh(new THREE.BoxGeometry(2.4, y * 2, d), std(0xffffff, { map: woodTex, roughness: 0.55 })); st.position.set(0, y, z); st.receiveShadow = st.castShadow = true; house.add(st); }
      for (const x of [-2.5, 2.5]) { const post = new THREE.Mesh(new THREE.BoxGeometry(0.22, 4.0, 0.22), trimMat); post.position.set(x, 2.45, 2.5); post.castShadow = true; house.add(post); }
      const porchRoof = new THREE.Mesh(new THREE.BoxGeometry(6, 0.18, 3.0), trimMat); porchRoof.position.set(0, 4.5, 1.3); porchRoof.rotation.x = 0.08; porchRoof.castShadow = true; house.add(porchRoof);
      for (let i = 0; i < 9; i++) { if (Math.abs(i - 4) < 2) continue; const b = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.7, 0.08), trimMat); b.position.set(-2.4 + i * 0.6, 0.8, 2.55); house.add(b); }
      const railL = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.1, 0.12), trimMat); railL.position.set(-1.75, 1.18, 2.55); house.add(railL);
      const railR = railL.clone(); railR.position.x = 1.75; house.add(railR);
      const lampBulb = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 8), std(0x000000, { emissive: 0xffd9a0, emissiveIntensity: 3 })); lampBulb.position.set(1.15, 2.9, 0.25); house.add(lampBulb);
      const porchLight = new THREE.PointLight(0xffcf8a, 14, 9, 2); porchLight.position.set(1.0, 2.8, 0.7); porchLight.castShadow = false; house.add(porchLight);
      const welcome = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.03, 0.65), std(0x6b4f2e, { roughness: 1 })); welcome.position.set(0, 0.465, 0.75); house.add(welcome);
      // bushes
      for (const [x, z, s] of [[-4.3, 0.8, 1.0], [4.4, 0.7, 1.1], [-5.6, 1.1, 0.8], [-3.2, 0.7, 0.7]]) {
        const bush = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 1), std(0x2f4a24, { flatShading: true, roughness: 0.9 }));
        bush.position.set(x, s * 0.7, z); bush.scale.y = 0.75; bush.castShadow = true; scene.add(bush);
      }
      // fence with a gap for the path, mailbox
      for (let i = -14; i <= 14; i++) {
        const x = i * 0.6; if (Math.abs(x) < 1.0) continue;
        const pk = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.1, 0.06), trimMat); pk.position.set(x, 0.55, 12.0); pk.castShadow = true; scene.add(pk);
        const tip = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.18, 4), trimMat); tip.position.set(x, 1.19, 12.0); tip.rotation.y = Math.PI / 4; scene.add(tip);
      }
      for (const s of [-1, 1]) { const rail = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.08, 0.05), trimMat); rail.position.set(s * 4.8, 0.75, 11.96); scene.add(rail); }
      const mbPost = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.1, 0.12), std(0x4a3a2a)); mbPost.position.set(-1.6, 0.55, 12.6); scene.add(mbPost);
      const mb = new THREE.Mesh(new RoundedBoxGeometry(0.45, 0.4, 0.75, 2, 0.12), std(0x2f5e8a, { roughness: 0.4, metalness: 0.4 })); mb.position.set(-1.6, 1.25, 12.6); scene.add(mb);

      // neighbours and far trees, for depth
      for (const [x, z, w, c] of [[-17, -6, 9, 0xa9b7a4], [18, -7, 10, 0xb9a99a], [-30, -10, 8, 0x9aa7b6], [31, -9, 9, 0xb3b0a2]]) {
        const nb = new THREE.Mesh(new THREE.BoxGeometry(w, 5, 7), std(c, { roughness: 0.85 })); nb.position.set(x, 2.5, z); nb.castShadow = nb.receiveShadow = true; scene.add(nb);
        const nr = new THREE.Mesh(new THREE.ExtrudeGeometry((() => { const s = new THREE.Shape(); s.moveTo(-w / 2 - 0.4, 0); s.lineTo(0, 2.6); s.lineTo(w / 2 + 0.4, 0); s.lineTo(-w / 2 - 0.4, 0); return s; })(), { depth: 7.6, bevelEnabled: false }), std(0x3c3634)); nr.position.set(x, 5, z - 3.8); scene.add(nr);
        for (const dx of [-2, 2]) { const nw = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.2), std(0x000000, { emissive: rng() > 0.4 ? 0xffb860 : 0x1a2233, emissiveIntensity: 1.1 })); nw.position.set(x + dx, 2.8, z + 3.52); scene.add(nw); }
      }
      for (let i = 0; i < 26; i++) {
        const x = -60 + i * 4.8 + (rng() - 0.5) * 2, z = -22 - rng() * 14, s = 2.5 + rng() * 2.5;
        const ft = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0), std(0x1f3320, { flatShading: true }));
        ft.position.set(x, s * 1.4, z); scene.add(ft);
      }

      // ---------- oak and treehouse ----------
      const TX = 8.5, TZ = 2.0;
      const barkMat = std(0x4b3626, { roughness: 0.95 });
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.75, 7.5, 10), barkMat); trunk.position.set(TX, 3.75, TZ); trunk.castShadow = true; scene.add(trunk);
      for (const [rx, rz, len, y] of [[0.0, 0.9, 3.2, 5.4], [0.0, -0.9, 3.0, 6.1], [0.8, 0.2, 2.6, 6.6]]) {
        const br = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.3, len, 7), barkMat); br.position.set(TX, y, TZ); br.rotation.set(rx, 0, rz); br.translateY(len / 2); br.castShadow = true; scene.add(br);
      }
      const leafMat = std(0x2c4a22, { flatShading: true, roughness: 0.9 });
      const leafMat2 = std(0x385a2a, { flatShading: true, roughness: 0.9 });

        } else if (o.hairType === "bun") {

        } else if (o.hairType === "puffs") {

      }
      function setFace(c, expr) { const u = c.userData; if (u.cur !== expr) { u.face.material.map = u.faces[expr]; u.face.material.needsUpdate = true; u.cur = expr; } }

      }

      // ---------- shots ----------
      const V = (x, y, z) => new THREE.Vector3(x, y, z);
      const SHOTS = [
        // [start, end, camFrom, camTo, lookFrom, lookTo, fov]
        [0, 1.8, V(2.4, 2.8, 6.4), V(1.7, 2.6, 5.4), V(0, 1.9, 0.6), V(0, 1.9, 0.6), 46],
        [1.8, 5, V(0.4, 2.4, 4.6), V(0.2, 2.35, 3.8), V(0, 2.25, 1.0), V(0, 2.25, 1.0), 44],
        [5, 9.7, V(IX + 1.4, 2.9, 5.6), V(IX + 0.8, 2.7, 4.4), V(IX + 0.2, 1.9, -1.2), V(IX + 0.3, 2.0, -1.2), 46],
        [9.7, 11, V(wx0 + 0.25, 2.55, -1.3), V(wx0 + 0.15, 2.55, -2.1), V(wx0, 2.5, -4.6), V(wx0, 2.5, -4.6), 44],
        [11, 12.9, V(0.9, 1.25, 6.4), V(0.6, 1.35, 5.6), V(0, 1.3, 2.8), V(0, 1.35, 2.8), 46],
        [12.9, 14.0, V(-4.6, 2.5, 4.9), V(-3.6, 2.4, 4.9), V(7.0, 2.2, 5.0), V(7.0, 2.0, 5.1), 50],
        [14.0, 16.5, V(0.3, 1.8, 4.8), V(0.2, 2.1, 5.3), V(0, 1.75, 2.85), V(0, 2.2, 2.85), 44],
        [16.5, 20.8, V(4.4, 2.4, 11.5), V(5.0, 2.8, 10.2), V(8.4, 2.4, 4.6), V(8.4, 2.9, 4.6), 48],
        [20.8, 24.8, V(13.4, 6.4, 11.2), V(12.6, 6.2, 10.4), V(8.4, 5.0, 4.3), V(8.4, 5.1, 4.3), 46],
        [24.8, 29, V(3.0, 4.0, 14.5), V(1.8, 4.8, 17.5), V(6.6, 3.8, 3.0), V(6.2, 3.8, 3.0), 48],
        [29, 31.8, V(7.8, 6.4, 9.6), V(7.8, 6.2, 8.8), V(7.8, 4.4, 4.1), V(7.8, 4.4, 4.1), 44],
        [31.8, 35, V(5.5, 2.3, 22.5), V(4.6, 2.2, 21.4), V(-1.2, 1.3, 14.4), V(-0.6, 1.4, 13.6), 46],
        [35, 37.9, V(0.4, 3.6, 16.2), V(0.9, 3.8, 15.2), V(7.4, 4.0, 4.0), V(7.4, 4.3, 4.0), 48],
        [37.9, 42, V(0.6, 2.75, 6.6), V(0.35, 2.75, 5.2), V(0, 2.55, 0.4), V(0, 2.65, 0.4), 44],
        [42, 46, V(3.05, 2.6, 14.3), V(3.05, 2.4, 13.1), V(3.05, 1.8, 8.5), V(3.05, 1.8, 8.5), 44],
        [46, 50, V(0, 2.7, 8.6), V(0, 2.7, 6.2), V(0, 2.75, 1.0), V(0, 2.95, 1.0), 44],
      ];
      function shotAt(t) { for (let i = SHOTS.length - 1; i >= 0; i--) if (t >= SHOTS[i][0]) return i; return 0; }

      const NIGHT = { hemiSky: new THREE.Color(0x2a3a5c), hemiGround: new THREE.Color(0x0c1208), hemiI: 1.05, key: new THREE.Color(0x9fb4ff), keyI: 1.9, keyPos: V(-14, 22, 16), fog: new THREE.Color(0x0b1322), fogD: 0.022 };
      const DAY = { hemiSky: new THREE.Color(0xc2d8f2), hemiGround: new THREE.Color(0x5a6440), hemiI: 1.15, key: new THREE.Color(0xffc98e), keyI: 3.0, keyPos: V(24, 10, 18), fog: new THREE.Color(0xd8c7ac), fogD: 0.012 };

      const tmpC = new THREE.Color();
      const d0 = (t) => (t >= 46 ? 0 : smooth(win(t, 29.0, 30.6)));
      host.render = (t) => {
        const si = shotAt(t), S = SHOTS[si];

        hemi.intensity = lerp(NIGHT.hemiI, DAY.hemiI, d);
        key.color.copy(NIGHT.key).lerp(DAY.key, d); key.intensity = lerp(NIGHT.keyI, DAY.keyI, d);
        key.position.lerpVectors(NIGHT.keyPos, DAY.keyPos, d);

          pose(sis, { legL: -1.45, legR: -1.45, armR: t > 8.8 ? -0.9 : -0.3, armL: -0.3, headY: 0.3 });

          setFace(dad, talk(36.0, 37.9) ? "angry-talk" : "angry");
          suitcase.visible = true; suitcase.position.set(4.1, 0.48, 10.0);
          // Mia still asleep, visible up there
          mia.visible = true; mia.position.set(HX + 0.95, HY + 0.32, HZ - 0.1); mia.rotation.set(0, 0, Math.PI / 2); pose(mia, {}); setFace(mia, "sleep");
        } else if (si === 13) {
          // S6b: stepmom opens the door and freezes
          place(mom, 0, 0.45, 0.45, 0);
          pose(mom, { armL: t < 38.6 ? -0.9 : -0.2, armR: 0, headX: t > 39.3 ? 0.15 : 0 });
          setFace(mom, t < 38.4 ? "neutral" : "shocked");
        } else if (si === 14) {
          // S7a: the new key
          place(mia, 3.9, 0, 8.5, -Math.PI / 2 + 0.75);
          place(dad, 2.2, -0.35, 8.5, Math.PI / 2 - 0.35);
          pose(dad, { legL: -0.5, legR: 0.6, armR: -1.2, armL: 0, headX: 0.2 });
          const give = easeInOut(win(t, 43.3, 44.3));
          pose(mia, { armL: -1.0 * give, armR: 0, headX: 0.1 });
          setFace(mia, t > 44.2 ? "happy" : "neutral"); setFace(dad, "happy");
          key3d.visible = true;
          key3d.position.set(lerp(2.95, 3.45, give), lerp(1.95, 1.75, give) + Math.sin(Math.PI * give) * 0.25, 8.5 + lerp(0.2, -0.15, give));
          key3d.rotation.set(0, t * 1.5, 0.3);
        } else {
          // S7b: the stepmom, locked out in the rain
          place(mom, 0, 0.45, 1.1, 0);
          pose(mom, { armL: -0.15, armR: -0.15, headX: 0.15 });
          setFace(mom, t < 47.0 ? "shocked" : "sad");
        }

        // rain centred where the camera looks
        updateRain(t, look.x, look.z, si === 2 || si === 3 ? 0 : r);
        for (let i = 0; i < flames.length; i++) flames[i].scale.y = 1.6 + 0.4 * Math.sin(t * 23 + i * 2);
        candleLight.intensity = 3 + Math.sin(t * 19) * 0.6;

        renderer.render(scene, camera);
      };
      host.render(host.clock.t);
      host.ready();
